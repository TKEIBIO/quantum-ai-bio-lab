name: 홈페이지 배포 및 양자 뉴스 업데이트

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 22 * * *"   # 매일 07:00 KST
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  SITE_DIR: quantum-ai-bio-lab

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 양자 뉴스 수집
        continue-on-error: true
        run: python "$SITE_DIR/scripts/fetch_news.py"
      - name: 한국양자생물학회 뉴스 수집
        continue-on-error: true
        run: python "$SITE_DIR/scripts/fetch_yangja.py"
      - name: 뉴스 변경분 커밋
        continue-on-error: true
        run: |
          git config user.name "news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$SITE_DIR/data/quantum-news.json" "$SITE_DIR/data/yangja-news.json"
          git diff --cached --quiet || (git commit -m "chore: 양자 뉴스 자동 업데이트" && git push)
      - run: touch "$SITE_DIR/.nojekyll"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: quantum-ai-bio-lab
      - id: deployment
        uses: actions/deploy-pages@v4
