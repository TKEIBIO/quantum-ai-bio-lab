<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>논문 · 퀀텀AI바이오 실증실험실</title>
  <meta name="description" content="퀀텀AI바이오 실증실험실 논문과 학회 발표">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Serif+KR:wght@500;600&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<main id="main">
  <header class="page-head"><div class="wrap">
    <h1>논문 · 발표</h1>
    <p>실험실의 논문, 학회 발표, 보고서입니다.</p>
  </div></header>
  <section class="block"><div class="wrap">
    <div class="toolbar">
      <div class="filters" id="filters" role="group" aria-label="유형"></div>
      <input class="search" id="q" type="search" placeholder="제목, 저자 검색" aria-label="논문 검색">
    </div>
    <div class="rows" id="pubs"></div>
  </div></section>
</main>
  <script src="assets/js/common.js"></script>
  <script>
    const LABELS = { all: "전체", journal: "저널 논문", conference: "학회 발표", preprint: "프리프린트", report: "보고서 · 기고" };
    let all = [], type = "all";
    function draw() {
      const q = document.getElementById("q").value.trim().toLowerCase();
      const list = all.filter(p => type === "all" || p.type === type)
        .filter(p => !q || JSON.stringify(p).toLowerCase().includes(q))
        .sort((a, b) => (b.year || 0) - (a.year || 0));
      document.getElementById("pubs").innerHTML = list.map(pubItem).join("") || '<p class="empty">찾는 항목이 없습니다. 검색어를 바꿔 보세요.</p>';
    }
    loadJSON("data/publications.json").then(list => {
      all = list || [];
      const types = ["all", ...new Set(all.map(p => p.type))];
      filterBar(document.getElementById("filters"), types.map(t => [t, LABELS[t] || t]), type, k => { type = k; draw(); });
      document.getElementById("q").oninput = draw;
      draw();
    });
  </script>
</body>
</html>
